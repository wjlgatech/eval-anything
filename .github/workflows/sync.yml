name: sync
on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: make sync
      - uses: peter-evans/create-pull-request@v6   # HUMAN-GATED — a person merges
        with:
          branch: sync/weekly
          title: 'weekly sync: what moved'
          commit-message: 'sync: weekly upstream refresh'
          body: 'Automated weekly registry refresh. Review + merge (human-gated by design).'
