# data/labs.yml — research labs & organizations (single source of truth; README generated).
# Researched 2026-07-22; URLs and status web-verified. `category` groups the rendered tables.

# ── Independent eval orgs ───────────────────────────────────────────────────
- category: independent
  name: METR
  url: https://metr.org
  what: "nonprofit measuring frontier-model autonomous capabilities on long-horizon real tasks"
  why: "the 50% time-horizon metric became the industry yardstick for agent autonomy; cited in nearly every frontier system card"
  flagship: "Time Horizons (1.1, 2026-01) + HCAST/RE-Bench"
- category: independent
  name: Apollo Research
  url: https://www.apolloresearch.ai
  what: "safety org specializing in deception, scheming, and hidden-misalignment evals"
  why: "defined in-context scheming as a measurable phenomenon; runs propensity evals for frontier labs"
  flagship: "In-context Scheming evals (arXiv:2412.04984)"
- category: independent
  name: Epoch AI
  url: https://epoch.ai
  what: "research institute tracking compute trends and running independent benchmarking"
  why: "the most rigorous third-party data source — its audit found errors in 42% of original FrontierMath problems"
  flagship: "FrontierMath (v2, 2026-06) + AI Benchmarking Hub"
- category: independent
  name: Arena (LMArena)
  url: https://lmarena.ai
  what: "crowdsourced blind pairwise model comparison, spun out of UC Berkeley ($150M Series A 2026-01)"
  why: "still the most-cited live human-preference leaderboard despite Leaderboard Illusion critiques"
  flagship: "Chatbot Arena + category arenas (WebDev, coding, vision)"
- category: independent
  name: EleutherAI
  url: https://www.eleuther.ai
  what: "open-source AI research nonprofit"
  why: "built the plumbing most academic evals run on; keeps the open reproducible-eval commons alive"
  flagship: "lm-evaluation-harness"
- category: independent
  name: MLCommons
  url: https://mlcommons.org/ailuminate/
  what: "industry consortium (MLPerf) building standardized AI risk & reliability benchmarks"
  why: "the closest thing to industry-standard safety certification (KPMG/Google/Microsoft assurance program 2026-02)"
  flagship: "AILuminate (12 hazard categories, 24k+ prompts/language)"
- category: independent
  name: Irregular (ex Pattern Labs)
  url: https://www.irregular.com
  what: "frontier AI security lab running offensive-cyber capability evals ($80M Series B 2025-09)"
  why: "its evals are cited in OpenAI and Anthropic system cards and used by the UK government"
  flagship: "SOLVE cyber-risk scoring + private cyber ranges"
- category: independent
  name: Gray Swan AI
  url: https://www.grayswan.ai
  what: "AI security company running crowdsourced adversarial red-teaming at scale"
  why: "its competitions (250k+ attack attempts) powered joint agent-hijacking research with US CAISI and UK AISI"
  flagship: "Gray Swan Arena + Shade"
- category: independent
  name: Meridian Labs
  url: https://meridianlabs.ai
  what: "independent eval nonprofit; co-developer of Inspect with UK AISI"
  why: "became the neutral steward of Anthropic's Petri (donated 2026-05 with the 3.0 release)"
  flagship: "Petri 3.0 stewardship + Inspect co-development"

# ── Government & institutes ─────────────────────────────────────────────────
- category: government
  name: UK AI Security Institute (AISI)
  url: https://www.aisi.gov.uk
  what: "UK government body doing pre-deployment frontier model testing"
  why: "its open framework became the shared eval substrate for other AISIs, frontier labs, and safety orgs"
  flagship: "Inspect + Inspect Evals (200+ prebuilt)"
- category: government
  name: US CAISI (ex US AISI)
  url: https://www.nist.gov/caisi
  what: "NIST-housed center running national-security-relevant capability evals (cyber, bio, chem)"
  why: "the US federal eval touchpoint; published large-scale agent red-teaming with Gray Swan and UK AISI"
  flagship: "CAISI model evaluations"
- category: government
  name: NIST ARIA
  url: https://ai-challenges.nist.gov/aria
  what: "sociotechnical field-testing of AI in realistic deployment settings"
  why: "pushes eval beyond benchmarks toward measuring real human-AI interaction outcomes"
  flagship: "ARIA pilot evaluations (healthcare, finance, public sector)"
- category: government
  name: EU AI Office
  url: https://digital-strategy.ec.europa.eu/en/policies/ai-code-practice
  what: "European Commission body enforcing the AI Act for general-purpose AI"
  why: "the GPAI Code of Practice makes state-of-the-art model evaluation a de-facto legal requirement (enforceable 2026)"
  flagship: "GPAI Code of Practice — Safety & Security chapter"

