name: eval-anything
emoji: 🧪
title: eval-anything — the Evaluation Operating System
tagline: an honest ❌ beats a fake ✅ — measure models, agents, and their guardrails
  against reality
description: 'One reliable place for evaluation of foundation models (LLM, VLM, VLA)
  and agentic systems — and the guardrails/security that adversarially test them.
  Tracks the field''s load-bearing harnesses, benchmarks, papers, labs, and people
  (lm-evaluation-harness, HELM, Inspect, SWE-bench, LLM-as-judge and its biases, red-teaming),
  tiers every claim by evidence, and ships tooling to design and run evals with Claude.
  The big picture is the OEC loop — Observe → Evaluate → Control: observability precedes
  eval (you cannot evaluate what you cannot observe), evaluation targets engineering
  soundness AND whether the business objective is on track, and eval without control
  (decisions, change) is just a scoreboard.

  '
audience: builders who must answer "is this model/agent good enough — and safe enough
  — to ship?" with evidence
github: wjlgatech/eval-anything
license: Apache-2.0
license_data: CC-BY-4.0
