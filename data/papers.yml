# data/papers.yml — seminal publications (single source of truth; README generated).
# Researched 2026-07-22; titles/authors/arXiv IDs web-verified. Citation rigor:
# every entry links its PRIMARY source. `category` groups the rendered tables.

# ── Foundational capability benchmarks ──────────────────────────────────────
- category: benchmarks
  title: "GLUE: A Multi-Task Benchmark and Analysis Platform for NLU"
  cite: "Wang et al. 2018, ICLR 2019"
  url: https://arxiv.org/abs/1804.07461
  why: "the template for all aggregate LLM benchmarks — drove the BERT era, saturated in ~1 year, taught the field about benchmark lifespan"
- category: benchmarks
  title: "SuperGLUE: A Stickier Benchmark for General-Purpose Language Understanding"
  cite: "Wang et al. 2019, NeurIPS 2019"
  url: https://arxiv.org/abs/1905.00537
  why: "canonical example of the build-harder-after-saturation cycle; itself saturated by 2021"
- category: benchmarks
  title: "Measuring Massive Multitask Language Understanding (MMLU)"
  cite: "Hendrycks et al. 2020, ICLR 2021"
  url: https://arxiv.org/abs/2009.03300
  why: "the default headline capability number from GPT-3 through GPT-4-class models; now saturated (>90%)"
- category: benchmarks
  title: "Evaluating Large Language Models Trained on Code (HumanEval)"
  cite: "Chen et al. 2021"
  url: https://arxiv.org/abs/2107.03374
  why: "established execution-based code eval; pass@k became the universal code metric"
- category: benchmarks
  title: "Training Verifiers to Solve Math Word Problems (GSM8K)"
  cite: "Cobbe et al. 2021"
  url: https://arxiv.org/abs/2110.14168
  why: "the standard reasoning benchmark of the chain-of-thought era; its contamination became a case study (GSM1k)"
- category: benchmarks
  title: "Measuring Mathematical Problem Solving with the MATH Dataset"
  cite: "Hendrycks et al. 2021, NeurIPS 2021 D&B"
  url: https://arxiv.org/abs/2103.03874
  why: "defined hard-math eval pre-FrontierMath; drove RL-for-reasoning research"
- category: benchmarks
  title: "Holistic Evaluation of Language Models (HELM)"
  cite: "Liang et al. 2022, TMLR 2023"
  url: https://arxiv.org/abs/2211.09110
  why: "made multi-metric, transparent, standardized-conditions evaluation the methodological gold standard"
- category: benchmarks
  title: "Beyond the Imitation Game (BIG-bench)"
  cite: "Srivastava et al. (444 authors) 2022, TMLR 2023"
  url: https://arxiv.org/abs/2206.04615
  why: "the massive community benchmark; its BIG-Bench Hard subset became a standard reasoning eval"
- category: benchmarks
  title: "HellaSwag: Can a Machine Really Finish Your Sentence?"
  cite: "Zellers et al. 2019, ACL 2019"
  url: https://arxiv.org/abs/1905.07830
  why: "introduced adversarial filtering against model exploits; long-time default commonsense metric"
- category: benchmarks
  title: "TruthfulQA: Measuring How Models Mimic Human Falsehoods"
  cite: "Lin et al. 2021, ACL 2022"
  url: https://arxiv.org/abs/2109.07958
  why: "first widely-adopted truthfulness benchmark; showed larger models can be LESS truthful"
- category: benchmarks
  title: "GPQA: A Graduate-Level Google-Proof Q&A Benchmark"
  cite: "Rein et al. 2023, COLM 2024"
  url: https://arxiv.org/abs/2311.12022
  why: "the frontier headline benchmark (GPQA Diamond) once MMLU saturated; designed for scalable-oversight research"
- category: benchmarks
  title: "MMLU-Pro: A More Robust and Challenging Benchmark"
  cite: "Wang et al. 2024, NeurIPS 2024 D&B"
  url: https://arxiv.org/abs/2406.01574
  why: "the canonical fix-the-saturated-flagship paper — 10 options, reasoning-heavy, less prompt-sensitive"
- category: benchmarks
  title: "FrontierMath: Evaluating Advanced Mathematical Reasoning in AI"
  cite: "Glazer et al. (Epoch AI) 2024"
  url: https://arxiv.org/abs/2411.04872
  why: "reset the math ceiling (<2% solve rate at release); center of the 2025 lab-access controversy; v2 corrected flawed problems 2026-06"
- category: benchmarks
  title: "Humanity's Last Exam"
  cite: "Phan et al. (CAIS/Scale, ~1000 contributors) 2025, Nature 2026"
  url: https://arxiv.org/abs/2501.14249
  why: "the 'final' closed-ended academic benchmark — the headline hard-knowledge number of 2025-26"
- category: benchmarks
  title: "On the Measure of Intelligence (ARC)"
  cite: "Chollet 2019"
  url: https://arxiv.org/abs/1911.01547
  why: "defines intelligence as skill-acquisition efficiency — the philosophical counterweight to skill benchmarks"
- category: benchmarks
  title: "ARC-AGI-2: A New Challenge for Frontier AI Reasoning Systems"
  cite: "Chollet et al. 2025"
  url: https://arxiv.org/abs/2505.11831
  why: "the active fluid-intelligence frontier — easy for humans, <25% for frontier models into 2026"

# ── LLM-as-judge & eval methodology ─────────────────────────────────────────
- category: judge
  title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
  cite: "Zheng et al. (LMSYS) 2023, NeurIPS 2023 D&B"
  url: https://arxiv.org/abs/2306.05685
  why: "the most-cited eval-methodology paper — legitimized LLM-as-judge AND documented its position/verbosity/self-enhancement biases"
- category: judge
  title: "Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference"
  cite: "Chiang et al. 2024, ICML 2024"
  url: https://arxiv.org/abs/2403.04132
  why: "formalized Bradley-Terry ratings + CIs over crowdsourced battles — the de-facto frontier leaderboard methodology"
- category: judge
  title: "Length-Controlled AlpacaEval: Debiasing Automatic Evaluators"
  cite: "Dubois et al. 2024"
  url: https://arxiv.org/abs/2404.04475
  why: "the canonical demonstration that auto-evaluators are gameable by verbosity — and the regression fix"
- category: judge
  title: "G-Eval: NLG Evaluation using GPT-4 with Better Human Alignment"
  cite: "Liu et al. 2023, EMNLP 2023"
  url: https://arxiv.org/abs/2303.16634
  why: "the most-used rubric-scoring recipe in production eval frameworks; also flagged self-preference bias"
- category: judge
  title: "Large Language Models are not Fair Evaluators"
  cite: "Wang et al. 2023, ACL 2024"
  url: https://arxiv.org/abs/2305.17926
  why: "the definitive position-bias study — judge verdicts flip on response order; made order-randomization standard"
- category: judge
  title: "Prometheus: Inducing Fine-grained Evaluation Capability in LMs"
  cite: "Kim et al. 2023, ICLR 2024"
  url: https://arxiv.org/abs/2310.08491
  why: "launched the open specialized-judge-model line (Prometheus 2 followed)"
- category: judge
  title: "Replacing Judges with Juries (Panel of LLM Evaluators, PoLL)"
  cite: "Verga et al. (Cohere) 2024"
  url: https://arxiv.org/abs/2404.18796
  why: "panel of small diverse judges beats one GPT-4 judge at 1/7 cost — established panel-of-judges practice"
- category: judge
  title: "Elo Uncovered: Robustness and Best Practices in LM Evaluation"
  cite: "Boubdir et al. (Cohere) 2023"
  url: https://arxiv.org/abs/2311.17295
  why: "showed arena Elo violates reliability/transitivity axioms — the core methodological critique of leaderboards"
- category: judge
  title: "The Leaderboard Illusion"
  cite: "Singh et al. 2025"
  url: https://arxiv.org/abs/2504.20879
  why: "exposed Chatbot Arena access asymmetries (private variants, selective retraction) — shook trust in the flagship leaderboard"
- category: judge
  title: "LiveBench: A Challenging, Contamination-Limited LLM Benchmark"
  cite: "White et al. 2024, ICLR 2025"
  url: https://arxiv.org/abs/2406.19314
  why: "the template for live monthly-refreshed benchmarks with objective ground truth"
- category: judge
  title: "LiveCodeBench: Holistic and Contamination-Free Code Evaluation"
  cite: "Jain et al. 2024, ICLR 2025"
  url: https://arxiv.org/abs/2403.07974
  why: "time-windowed scoring exposed HumanEval overfitting — the standard live coding benchmark"
- category: judge
  title: "NLP Evaluation in Trouble: Measuring LLM Data Contamination"
  cite: "Sainz et al. 2023, Findings of EMNLP"
  url: https://arxiv.org/abs/2310.18018
  why: "made contamination auditing a recognized research area (LM Contamination Index)"
- category: judge
  title: "A Careful Examination of LLM Performance on Grade School Arithmetic (GSM1k)"
  cite: "Zhang et al. (Scale AI) 2024, NeurIPS 2024 D&B"
  url: https://arxiv.org/abs/2405.00332
  why: "rebuilt GSM8K from scratch, found 8-13% drops — the cleanest empirical proof of contamination in the wild"

# ── Agentic & coding-agent evaluation ───────────────────────────────────────
- category: agentic
  title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?"
  cite: "Jimenez et al. 2023, ICLR 2024 oral"
  url: https://arxiv.org/abs/2310.06770
  why: "THE agentic coding benchmark — SWE-bench Verified is the industry's coding-agent headline metric"
- category: agentic
  title: "WebArena: A Realistic Web Environment for Building Autonomous Agents"
  cite: "Zhou et al. 2023, ICLR 2024"
  url: https://arxiv.org/abs/2307.13854
  why: "set the standard for realistic, reproducible web-agent eval; spawned VisualWebArena and the browser-agent field"
- category: agentic
  title: "GAIA: A Benchmark for General AI Assistants"
  cite: "Mialon et al. (Meta/HF) 2023"
  url: https://arxiv.org/abs/2311.12983
  why: "conceptually-simple, tool-requiring questions (humans 92%, GPT-4 15%) — the default general-assistant leaderboard"
- category: agentic
  title: "AgentBench: Evaluating LLMs as Agents"
  cite: "Liu et al. (Tsinghua) 2023, ICLR 2024"
  url: https://arxiv.org/abs/2308.03688
  why: "first systematic multi-environment agent benchmark — coined LLM-as-agent evaluation"
- category: agentic
  title: "OSWorld: Benchmarking Multimodal Agents in Real Computer Environments"
  cite: "Xie et al. 2024, NeurIPS 2024"
  url: https://arxiv.org/abs/2404.07972
  why: "executable VM environments with state-based verification — the reference for computer-use agents"
- category: agentic
  title: "τ-bench: Tool-Agent-User Interaction in Real-World Domains"
  cite: "Yao et al. (Sierra) 2024"
  url: https://arxiv.org/abs/2406.12045
  why: "reframed agent eval around reliability and rule-following via pass^k; τ²-bench extends it"
- category: agentic
  title: "MLE-bench: Evaluating ML Agents on Machine Learning Engineering"
  cite: "Chan et al. (OpenAI) 2024, ICLR 2025"
  url: https://arxiv.org/abs/2410.07095
  why: "75 Kaggle competitions with medal-based human comparison — the standard AI-automating-ML eval"
- category: agentic
  title: "RE-Bench: Evaluating Frontier AI R&D Capabilities Against Human Experts"
  cite: "Wijk et al. (METR) 2024, ICML 2025"
  url: https://arxiv.org/abs/2411.15114
  why: "open-ended ML-research environments with 71 expert 8-hour baselines — wired into lab safety policies"
- category: agentic
  title: "Measuring AI Ability to Complete Long Tasks"
  cite: "Kwa, West, et al. (METR) 2025"
  url: https://arxiv.org/abs/2503.14499
  why: "the 50% time-horizon metric, doubling every ~7 months — arguably the most influential eval result of 2025"
- category: agentic
  title: "AgentHarm: Measuring Harmfulness of LLM Agents"
  cite: "Andriushchenko et al. (UK AISI/Gray Swan) 2024, ICLR 2025"
  url: https://arxiv.org/abs/2410.09024
  why: "the first standard agent-misuse benchmark — adopted into Inspect and AISI evaluations"

# ── VLM evaluation ──────────────────────────────────────────────────────────
- category: vlm
  title: "VQA: Visual Question Answering"
  cite: "Antol et al. 2015, ICCV 2015"
  url: https://arxiv.org/abs/1505.00468
  why: "founded the visual-QA lineage; VQAv2's balanced pairs killed language priors — ancestor of every VLM benchmark"
- category: vlm
  title: "MMMU: Massive Multi-discipline Multimodal Understanding"
  cite: "Yue et al. 2023, CVPR 2024 oral"
  url: https://arxiv.org/abs/2311.16502
  why: "the MMLU of multimodal — headline benchmark on every frontier VLM release"
- category: vlm
  title: "MathVista: Evaluating Mathematical Reasoning in Visual Contexts"
  cite: "Lu et al. 2023, ICLR 2024 oral"
  url: https://arxiv.org/abs/2310.02255
  why: "the standard visual-reasoning number; exposed the vision-reasoning gap in GPT-4V-class models"
- category: vlm
  title: "MMBench: Is Your Multi-modal Model an All-around Player?"
  cite: "Liu et al. 2023, ECCV 2024"
  url: https://arxiv.org/abs/2307.06281
  why: "its CircularEval trick (rotating MC options) became a widely-copied robustness fix"
- category: vlm
  title: "POPE: Evaluating Object Hallucination in Large Vision-Language Models"
  cite: "Li et al. 2023, EMNLP 2023"
  url: https://arxiv.org/abs/2305.10355
  why: "defined VLM hallucination measurement — the default metric cited in nearly every VLM paper since"

# ── VLA / embodied evaluation ───────────────────────────────────────────────
- category: vla
  title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models"
  cite: "OXE Collaboration 2023, ICRA 2024 Best Paper"
  url: https://arxiv.org/abs/2310.08864
  why: "created the shared data substrate and de-facto eval setups for the whole VLA era"
- category: vla
  title: "Evaluating Real-World Robot Manipulation Policies in Simulation (SIMPLER)"
  cite: "Li et al. 2024, CoRL 2024"
  url: https://arxiv.org/abs/2405.05941
  why: "real-to-sim eval correlating sim scores with real-robot rankings — (partially) solved robot eval reproducibility"
- category: vla
  title: "LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning"
  cite: "Liu et al. 2023, NeurIPS 2023 D&B"
  url: https://arxiv.org/abs/2306.03310
  why: "the default sim benchmark reported by essentially every 2024-26 VLA paper"
- category: vla
  title: "CALVIN: Language-Conditioned Policy Learning for Long-Horizon Manipulation"
  cite: "Mees et al. 2021, RA-L 2022"
  url: https://arxiv.org/abs/2112.03227
  why: "the original language-conditioned manipulation benchmark; chain-of-5-instructions remains a standard metric"
- category: vla
  title: "π0: A Vision-Language-Action Flow Model for General Robot Control"
  cite: "Black et al. (Physical Intelligence) 2024"
  url: https://arxiv.org/abs/2410.24164
  why: "defined the pi-0-era eval protocol (scored real-world rubrics, out-of-box vs fine-tuned) — and exposed that VLA still lacks a shared harness"

