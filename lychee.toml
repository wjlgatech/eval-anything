# accept bot-unfriendly codes — don't let false-negative link checks block CI
accept = [200, 202, 206, 403, 405, 406, 415, 429]
max_retries = 2
timeout = 20
# family repos are PRIVATE — anonymous link checks 404 on them by design;
# launchdarkly.com intermittently refuses CI connections (bot-blocking) — verified manually 2026-07-22
exclude = ["github\\.com/wjlgatech/", "launchdarkly\\.com"]
